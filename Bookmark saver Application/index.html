<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./styles.css" rel="stylesheet" />
    <title>Bookmark Saver</title>
</head>
<body>
    <div class="box-container">
        <h1 class="h1-title">Bookmark Saver</h1>
        <form action="/">
            <input type="text" id="bookmark-name" placeholder="Bookmark name" />
            <input type="text" id="bookmark-url" placeholder="Bookmark URL" />
            <input type="submit" id="add-bkmk" value="Add Bookmark" />
        </form>
        
        <div class="added-items">
            <ul class="bookmark-list">
            </ul>
        </div>
    </div>
    <script src="./index.js" charset="UTF-8"></script> 
</body>
</html>
