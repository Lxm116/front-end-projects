<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./styles.css" rel="stylesheet" />
    <title>Kaban Board</title>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2 class="card-header">Things to Do</h2>
            <hr />
            <div class="list" draggable="true" id="task1">Pick up new book</div>
            <div class="list" draggable="true" id="task2">Buy groceries at the store</div>
            <div class="list" draggable="true" id="task3">Get workstation ready</div>
        </div>
        <div class="card">
            <h2 class="card-header">In Progress</h2>
            <hr />
            <div class="list" draggable="true" id="task4">Fixing the Computer</div>
            <div class="list" draggable="true" id="task5" >Sorting things out</div>
        </div>
        <div class="card">
            <h2 class="card-header">Things Done</h2>
            <hr />
        </div>
    </div>
    <script src="./index.js" charset="utf-8"></script>
</body>
</html>
